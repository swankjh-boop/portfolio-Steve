<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>관리자 | 포트폴리오</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 관리자 화면에만 쓰는 모양 (색·글꼴·카드는 style.css를 그대로 씀) */
    .panel {
      display: block;
      margin-top: 24px;
      padding: 40px;
    }
    .panel:first-child { margin-top: 0; }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .topbar .big-title { margin: 0; }
    .who { color: var(--gray); font-size: 14px; }
    .row-buttons { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .btn {
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--white);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--blue); color: var(--blue); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: var(--white); }
    .btn.danger:hover { border-color: #dc2626; color: #dc2626; }
    .btn.small { padding: 6px 10px; font-size: 13px; }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 16px;
    }
    .fields .wide { grid-column: 1 / -1; }
    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }
    .field input[type="text"],
    .field input[type="email"],
    .field input[type="password"],
    .field textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      font-size: 15px;
    }
    .field textarea { min-height: 84px; resize: vertical; }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--blue); }
    .hint { margin: 4px 0 0; font-size: 12px; color: var(--gray); }
    .hint a { color: var(--blue); }

    .login-box { max-width: 420px; margin: 0 auto; }
    .login-box .field { margin-bottom: 14px; }

    .msg { min-height: 1.6em; margin: 12px 0 0; font-size: 14px; font-weight: 700; }
    .msg.ok { color: #16a34a; }
    .msg.error { color: #dc2626; }

    .photo-row { display: flex; gap: 16px; align-items: center; }
    .photo-row .photo { width: 96px; flex: none; border-radius: 16px; }

    .section-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .section-head .big-title { margin: 0; font-size: 26px; }

    /* 카드 목록 한 줄 */
    .admin-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .admin-item {
      display: grid;
      grid-template-columns: 96px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .admin-item .thumb-img { border-radius: 10px; overflow: hidden; }
    .admin-item .card-title { margin: 2px 0; }
    .admin-item .likes-text { font-size: 13px; color: #f43f5e; font-weight: 700; }

    .editor {
      margin-top: 20px;
      padding: 24px;
      border: 2px solid var(--blue);
      border-radius: 20px;
      background: #fbfcff;
    }
    .editor h3 { margin: 0 0 16px; }

    .gb-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .gb-item > div { min-width: 0; }

    @media (max-width: 820px) {
      .panel { padding: 24px; margin-top: 16px; }
      .fields { grid-template-columns: 1fr; }
      .admin-item { grid-template-columns: 72px 1fr; }
      .admin-item .row-buttons { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main class="page">

    <!-- 로그인 화면 -->
    <section class="sheet panel" id="login-view" hidden>
      <div class="login-box">
        <h1 class="big-title">ADMIN</h1>
        <p class="intro">관리자 이메일과 비밀번호로 로그인해 주세요.</p>
        <div class="field">
          <label for="login-email">이메일</label>
          <input id="login-email" type="email" autocomplete="username">
        </div>
        <div class="field">
          <label for="login-password">비밀번호</label>
          <input id="login-password" type="password" autocomplete="current-password">
        </div>
        <button type="button" class="btn primary" id="login-button">로그인</button>
        <p class="msg" id="login-msg"></p>
        <p class="hint"><a href="index.html">방문자 화면으로 가기</a></p>
      </div>
    </section>

    <!-- 관리자가 아닐 때 -->
    <section class="sheet panel" id="denied-view" hidden>
      <h1 class="big-title">ADMIN</h1>
      <p class="intro">관리자만 쓸 수 있어요.</p>
      <button type="button" class="btn" id="denied-logout">로그아웃</button>
    </section>

    <!-- 관리자 화면 -->
    <div id="admin-view" hidden>

      <section class="sheet panel">
        <div class="topbar">
          <h1 class="big-title">ADMIN</h1>
          <div class="row-buttons">
            <span class="who" id="who"></span>
            <a class="btn" href="index.html" target="_blank" rel="noopener">방문자 화면 보기</a>
            <button type="button" class="btn" id="logout-button">로그아웃</button>
          </div>
        </div>
      </section>

      <!-- 프로필 -->
      <section class="sheet panel">
        <div class="section-head">
          <h2 class="big-title">프로필</h2>
        </div>

        <div class="fields">
          <div class="field wide">
            <label>프로필 사진</label>
            <div class="photo-row">
              <div class="photo" id="p-photo-preview"></div>
              <div>
                <input type="file" id="p-photo" accept="image/png,image/jpeg,image/webp,image/gif">
                <p class="hint">사진을 고른 뒤 아래 "프로필 저장"을 누르면 올라가요. 이미지, 10MB까지.</p>
              </div>
            </div>
          </div>
          <div class="field"><label for="p-name">이름</label><input type="text" id="p-name"></div>
          <div class="field"><label for="p-title">직함</label><input type="text" id="p-title"></div>
          <div class="field"><label for="p-career_badge">경력 배지</label><input type="text" id="p-career_badge"></div>
          <div class="field"><label for="p-email">이메일</label><input type="text" id="p-email"></div>
          <div class="field"><label for="p-phone">연락처</label><input type="text" id="p-phone"></div>
          <div class="field"><label for="p-location">위치</label><input type="text" id="p-location"></div>
          <div class="field wide">
            <label for="p-headline">한 줄 소개 제목</label><input type="text" id="p-headline">
            <p class="hint">이름이 들어 있으면 방문자 화면에서 이름에 파란 밑줄이 생겨요.</p>
          </div>
          <div class="field wide"><label for="p-intro">소개 글</label><textarea id="p-intro"></textarea></div>
          <div class="field wide"><label for="p-education">EDUCATION</label><textarea id="p-education"></textarea></div>
          <div class="field wide"><label for="p-skills">SKILLS &amp; TOOLS</label><textarea id="p-skills"></textarea></div>
          <div class="field wide"><label for="p-experience">EXPERIENCE</label><textarea id="p-experience"></textarea></div>
          <div class="field wide"><label for="p-quote">맨 아래 인용</label><textarea id="p-quote"></textarea></div>
        </div>

        <p class="msg" id="profile-msg"></p>
        <button type="button" class="btn primary" id="profile-save">프로필 저장</button>
      </section>

      <!-- 포트폴리오 카드 + 좋아요 -->
      <section class="sheet panel">
        <div class="section-head">
          <h2 class="big-title">포트폴리오 카드</h2>
          <button type="button" class="btn primary" id="project-new">카드 추가</button>
        </div>
        <p class="hint">위에서부터 방문자 화면에 보이는 순서예요. 하트 옆 숫자가 그 카드의 좋아요 수예요.</p>
        <p class="msg" id="projects-msg"></p>

        <!-- 카드 추가·수정 칸 (누르면 열림) -->
        <div class="editor" id="editor" hidden>
          <h3 id="editor-title">카드 추가</h3>
          <div class="fields">
            <div class="field"><label for="e-number">번호</label><input type="text" id="e-number" placeholder="예: 01"></div>
            <div class="field"><label for="e-category">분류</label><input type="text" id="e-category"></div>
            <div class="field wide"><label for="e-title">제목 (꼭 적기)</label><input type="text" id="e-title"></div>
            <div class="field wide"><label for="e-description">설명</label><textarea id="e-description"></textarea></div>
            <div class="field wide">
              <label for="e-tags">태그</label><input type="text" id="e-tags" placeholder="쉼표로 나눠 적기. 예: 총괄 PM, UI/UX">
            </div>
            <div class="field">
              <label for="e-thumbnail">썸네일 이미지</label>
              <input type="file" id="e-thumbnail" accept="image/png,image/jpeg,image/webp,image/gif">
              <p class="hint" id="e-thumbnail-now"></p>
            </div>
            <div class="field">
              <label for="e-file">첨부 파일 (이미지 또는 PDF)</label>
              <input type="file" id="e-file" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf">
              <p class="hint" id="e-file-now"></p>
            </div>
          </div>
          <p class="msg" id="editor-msg"></p>
          <div class="row-buttons">
            <button type="button" class="btn primary" id="editor-save">저장</button>
            <button type="button" class="btn" id="editor-cancel">취소</button>
          </div>
        </div>

        <ul class="admin-list" id="project-list"></ul>
      </section>

      <!-- 방명록 -->
      <section class="sheet panel">
        <div class="section-head">
          <h2 class="big-title">방명록</h2>
        </div>
        <p class="msg" id="guestbook-msg"></p>
        <ul class="gb-list" id="guestbook-list"></ul>
      </section>

    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
